{% extends "base.html" %}

{% block title %}404 - Page Not Found - CampusFind{% endblock %}

{% block content %}
<div class="text-center py-20 px-4 space-y-4 max-w-md mx-auto">
    <div class="w-16 h-16 rounded-3xl bg-blue-50 dark:bg-blue-950 text-blue-600 dark:text-blue-400 flex items-center justify-center text-3xl font-bold mx-auto">
        <i class="fa-solid fa-compass"></i>
    </div>
    <h1 class="text-4xl font-black text-slate-900 dark:text-white">404</h1>
    <h2 class="text-lg font-bold text-slate-700 dark:text-slate-300">Item or Page Not Found</h2>
    <p class="text-xs text-slate-500 dark:text-slate-400">
        The campus report or page you're searching for might have been closed, returned, or relocated.
    </p>
    <div class="pt-4">
        <a href="{{ url_for('index') }}" class="px-5 py-2.5 rounded-xl font-bold text-xs bg-blue-600 hover:bg-blue-700 text-white shadow-sm transition">
            Back to Campus Home
        </a>
    </div>
</div>
{% endblock %}
